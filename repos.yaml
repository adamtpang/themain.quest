# repos.yaml v0 — see github.com/adamtpang/repo-connect
repo: themain.quest
is: A single-screen, mobile-first life dashboard that shows the one move that matters most right now, refusing to let motion masquerade as progress.
url: https://themain.quest
cluster: money-os

kin:
  - repo: moneymeta.fun
    why: moneymeta is the income side of Adam's money OS; themain.quest is where the day-to-day moves that grow it (posting a draft, making a call) actually get tracked and executed.
  - repo: deathmoney.fyi
    why: deathmoney is the expense/debt side of the same money OS; themain.quest is where its real action items (the ASAP checklist tasks) live as daily quests instead of a static file nobody reopens.
  - repo: eyeland.cards
    why: eyeland.cards' DESIGN.md distills real game-origin-story research into concrete design rules for what makes a quest loop actually fun; Adam wants that same thinking applied to themain.quest, since it's the dashboard for the one game he considers the one that actually matters, his own life.
  - repo: sprite.email
    why: sprite already computes importance x urgency triage over every Gmail inbox and classifies REPLY/TASK/NOISE (triage-score.ts), a real source of candidate "one move" items (expiring API keys, verification deadlines) that themain.quest doesn't pull from yet.
  - repo: optimism.fun
    why: optimism.fun ranks which problems are worth a lifetime of work at civilizational scale, the macro choose-the-quest layer; this repo holds whatever quest Adam actually commits to as the one binding goal and runs it day to day, the micro execute-the-quest layer. Same quest-selection thesis, different scale. In the who/what/where life map this repo hubs, optimism.fun is one of the two WHAT engines (which problem deserves the work), alongside skill.supply (which paid seat to take on it).
  - repo: ObsidianVault
    why: the vault is Adam's life knowledge base and life game OS (updated 2026-08-20). Its six live surfaces (🗺️ QUESTBOOK with the 100-year map and quest chains, 🧙 CHARACTER, 🌟 S-TIER LIFE, 🐆 outbox as the daily board, 🐢 inbox, questline/ Russian-doll containers) ARE the game state this dashboard fronts; the outbox's top task is literally the "one move" this app exists to surface. The /process, /fillup, and /find-limiting-factor skills that maintain the vault read this repo's lib/route.ts for session routing. The 8020.best boards remain as a legacy ranked feed.
  - repo: 8020.best
    why: Same importance x urgency triage pattern as sprite.email and the ObsidianVault boards, applied to browser tabs instead of inbox or notes -- AI-buckets and tiers (S/A/B/C/D/F) open tabs weighted against the same FOCUS.md priorities themain.quest is built around, surfacing the top few as one-click "Next up" actions. Another candidate "one move" feed themain.quest doesn't pull from yet.
  - repo: skill.supply
    why: skill.supply runs the quest that IS currently the main quest (Aether/GOAL.md, an S-tier income stream inside a 2-3 month runway). Its SEND_TODAY.md, funnel-status.json, and X_CALENDAR.md are real ranked one-move feeds, today's literal one move is a send button in that repo, another candidate source this dashboard doesn't pull from yet. In the who/what/where life map this repo hubs, skill.supply is the other WHAT engine (the concrete paid work), pairing with optimism.fun (the problem worth working on).
  - repo: pokedex.life
    why: This repo's own CLAUDE.md names WHO (people) as one of its three lenses alongside WHAT and WHERE, deep-linked out with nothing behind it yet. pokedex.life is the real WHO substance -- Trust (Character/Ability/Spark) scoring, Champion-tier ranking, a type-diversity check, and a Trust-override UI on Adam's actual X/IG graph -- built 2026-08-14, the natural destination for that deep link. In the life map this repo hubs (after Naval Ravikant's three big decisions: what you do, who you're with, where you live), pokedex.life is the WHO engine.
  - repo: portal.voyage
    why: the WHERE engine of the life map this repo hubs. This repo's CLAUDE.md names WHERE (places) as one of its three lenses alongside WHAT and WHO (Naval Ravikant's three big decisions that deserve deliberate time); portal.voyage is the real WHERE substance, a constraint-matcher (lib/score.ts) that ranks where to live given passport and field. Live case: the current main quest's SF-vs-Austin-vs-Singapore location question is exactly a portal.voyage query.
  - repo: summon.guide
    why: the current binding quest is to learn from Popper and Deutsch and mine that into questbook material. summon.guide already has a fully grounded David Deutsch guide (figures.ts slug "deutsch", sourced from The Beginning of Infinity and The Fabric of Reality), a real chat-against mentor for the fallibilist epistemology (conjecture, criticism, the "problems are soluble" thesis) this quest is actually about, not just a reading list.
